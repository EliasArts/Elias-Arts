<head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ivory:#f6f2e9;--sand:#eae3d7;--paper:#fcfbf7;--ink:#292724;--muted:#6b665e;--border:#d4cdc1;--sage-dark:#52695c}
*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:Manrope,sans-serif;line-height:1.6}a{text-decoration:none;color:inherit}.container{width:min(1000px,calc(100% - 32px));margin:auto}
header{height:72px;border-bottom:1px solid var(--border);display:flex;align-items:center}.nav{display:flex;align-items:center;justify-content:space-between}.logo,h1{font-family:"DM Serif Display",serif;font-weight:400}.logo{font-size:30px}.nav-links{display:flex;gap:24px;font-size:13px}.nav-links a:hover{text-decoration:underline;text-underline-offset:4px}
.page{padding:58px 0 100px}.crumb{font-size:11px;color:var(--muted);margin-bottom:20px}.crumb a{text-decoration:none}h1{font-size:58px;line-height:1;margin:0 0 24px}.content{max-width:760px;color:var(--muted);font-size:14px;line-height:1.9}.btn{display:inline-block;margin-top:28px;background:var(--sage-dark);color:#fff;border-radius:999px;padding:12px 20px;font-size:12px;font-weight:700}
</style></head>
<body>
<header><div class="container nav"><a class="logo" href="/">EliasArts</a><nav class="nav-links"><a href="/">Home</a><a href="/search">Search</a></nav></div></header>
<main class="container page"><div class="crumb"><a href="/">Home</a> / <span id="crumb"></span></div><h1 id="title"></h1><div class="content" id="body"></div><a class="btn" href="/">Back to Elias Arts</a></main>
<script>
const pages={
 about:{title:'About Elias Arts',body:'<p>Elias Arts is a growing library of thoughtfully designed free printables for everyday creativity, planning, learning, decorating and gifting.</p><p>The goal is simple: make useful, beautiful printable resources easy to discover and free to download.</p>'},
 contact:{title:'Contact',body:'<p>For questions, feedback, corrections or collaboration enquiries, use the contact method published by Elias Arts.</p><p>A dedicated contact address or form can be added here when the project is ready for it.</p>'},
 privacy:{title:'Privacy Policy',body:'<p>Elias Arts is designed to collect as little information as practical. When you subscribe, your email address is stored so Elias Arts can send updates about new printables.</p><p>Elias Arts also uses privacy-conscious site analytics to understand page views and printable downloads. The custom analytics used by the site does not intentionally record subscriber email addresses or IP addresses.</p><p>Cloudflare may process technical information needed to deliver and secure the website. This policy should be reviewed and expanded before any additional advertising, analytics or third-party services are introduced.</p>'},
 terms:{title:'Terms of Use',body:'<p>Unless a printable says otherwise, Elias Arts downloads are provided for personal use. Do not resell, redistribute or upload the original files as your own.</p><p>Printable-specific licensing information takes precedence over this general guidance.</p>'}
};
const key=new URLSearchParams(location.search).get('page')||'about';const p=pages[key]||pages.about;
document.title=p.title+' — Elias Arts';const dm=document.querySelector('meta[name="description"]');if(dm)dm.content=p.title==='Privacy Policy'?'How Elias Arts handles subscriptions, analytics and technical website information.':p.title==='Contact'?'Contact Elias Arts about the free printable library.':p.title==='Terms of Use'?'Terms for using and sharing Elias Arts free printable downloads.':'About Elias Arts and its free printable library.';document.getElementById('title').textContent=p.title;document.getElementById('crumb').textContent=p.title;document.getElementById('body').innerHTML=p.body;
</script></body></html>
