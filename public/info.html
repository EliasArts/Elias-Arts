<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elias Arts</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--ivory:#f6f2e9;--sand:#eae3d7;--paper:#fcfbf7;--ink:#292724;--muted:#6b665e;--border:#d4cdc1;--sage-dark:#52695c}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:Manrope,sans-serif}a{text-decoration:none;color:inherit}.container{width:min(1000px,calc(100% - 32px));margin:auto}header{height:72px;border-bottom:1px solid var(--border);display:flex;align-items:center}.nav{display:flex;justify-content:space-between}.logo,h1,h2{font-family:"DM Serif Display";font-weight:400}.logo{font-size:30px}.nav a{font-size:13px;margin-left:22px}.page{padding:60px 0 90px}.crumb{font-size:11px;color:var(--muted)}h1{font-size:58px;margin:15px 0}.content{max-width:720px;color:var(--muted);font-size:14px;line-height:1.9}.content h2{color:var(--ink);font-size:28px;margin-top:35px}.btn{display:inline-block;margin-top:25px;background:var(--sage-dark);color:#fff;border-radius:999px;padding:12px 20px;font-size:12px;font-weight:700}</style><style>.cat-menu-wrap{position:relative}.cat-menu-btn{border:0;background:none;color:var(--ink);font:13px Manrope;cursor:pointer;padding:8px 0;display:inline-flex;align-items:center;gap:6px}.cat-menu-btn svg{width:13px;height:13px;display:block;transition:transform .18s ease}.cat-menu-btn[aria-expanded="true"] svg{transform:rotate(180deg)}.cat-menu{display:none;position:absolute;right:0;top:38px;width:min(720px,calc(100vw - 28px));background:var(--paper);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 45px rgba(41,39,36,.12);padding:22px;z-index:50}.cat-menu.open{display:block}.cat-menu-title{font-family:"DM Serif Display";font-size:24px;margin-bottom:16px}.cat-menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.cat-menu-col>a{display:block;font-weight:700;font-size:13px;margin-bottom:8px}.cat-menu-col a.topic-link{font-weight:400;color:var(--muted);font-size:12px;margin:5px 0}.cat-menu-col a:hover{color:var(--sage-dark)}@media(max-width:700px){.cat-menu{right:-10px}.cat-menu-grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.cat-menu-grid{grid-template-columns:1fr}}</style></head><body><header><div class="container nav"><a class="logo" href="/">EliasArts</a><nav><div class="cat-menu-wrap"><button class="cat-menu-btn" id="catMenuBtn" type="button" aria-expanded="false">Categories <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button><div class="cat-menu" id="catMenu"><div class="cat-menu-title">Browse all categories</div><div id="catMenuGrid" class="cat-menu-grid"></div></div></div><a href="/search">Search</a><a href="/category.html">Categories</a></nav></div></header><main class="container page"><div class="crumb"><a href="/">Home</a> / <span id="crumb"></span></div><h1 id="title"></h1><div class="content" id="body"></div><a class="btn" href="/">Back to Elias Arts</a></main><script>
const pages={about:{title:'About Elias Arts',body:'<p>Elias Arts is a growing library of thoughtfully designed free printables for everyday creativity, planning, learning, decorating and gifting.</p><p>The goal is simple: make useful, beautiful printable resources easy to discover and free to download.</p>'},contact:{title:'Contact',body:'<p>For questions, feedback, corrections or collaboration enquiries, please use the contact method provided by Elias Arts when it is published.</p><p>This page can be updated later with your dedicated email address or contact form.</p>'},privacy:{title:'Privacy Policy',body:'<p>Elias Arts is designed to collect as little information as practical. If you subscribe, your email address is stored so Elias Arts can send updates about new printables.</p><p>Third-party services such as Cloudflare may process technical information required to operate and secure the website. This policy should be expanded with the final advertising and analytics providers before the site launches monetization.</p>'},terms:{title:'Terms of Use',body:'<p>Unless a printable says otherwise, Elias Arts downloads are provided for personal use. Do not resell, redistribute or upload the original files as your own.</p><p>Printable-specific licensing information should always take precedence over this general guidance.</p>'}};const key=new URLSearchParams(location.search).get('page')||'about';const p=pages[key]||pages.about;document.title=p.title+' — Elias Arts';document.getElementById('title').textContent=p.title;document.getElementById('crumb').textContent=p.title;document.getElementById('body').innerHTML=p.body;
</script><script>async function loadCategoryMenu(){try{const [a,b]=await Promise.all([fetch('/api/categories'),fetch('/api/topics')]);if(!a.ok||!b.ok)throw Error();const cats=await a.json(),topics=await b.json(),by={};topics.forEach(t=>(by[t.category_id]??=[]).push(t));const grid=document.getElementById('catMenuGrid');if(grid)grid.innerHTML=cats.map(c=>'<div class="cat-menu-col"><a href="/category.html?slug='+encodeURIComponent(c.slug)+'">'+navEsc(c.name)+'</a>'+((by[c.id]||[]).map(t=>'<a class="topic-link" href="/search?q='+encodeURIComponent(t.name)+'">'+navEsc(t.name)+'</a>').join(''))+'</div>').join('')}catch(e){console.error(e)}}function navEsc(s){return String(s??'').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]))}const cmb=document.getElementById('catMenuBtn'),cm=document.getElementById('catMenu');cmb?.addEventListener('click',e=>{e.stopPropagation();const open=cm.classList.toggle('open');cmb.setAttribute('aria-expanded',open?'true':'false')});document.addEventListener('click',()=>{cm?.classList.remove('open');cmb?.setAttribute('aria-expanded','false')});loadCategoryMenu();</script></body></html>
