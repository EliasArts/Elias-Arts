<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Printable — Elias Arts</title>
<meta name="description" content="Free printable from Elias Arts.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ivory:#f6f2e9;--sand:#eae3d7;--paper:#fcfbf7;--ink:#292724;--muted:#6b665e;--border:#d4cdc1;--sage:#7c9583;--sage-dark:#52695c}
*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:Manrope,sans-serif;line-height:1.5}a{text-decoration:none;color:inherit}.container{width:min(1280px,calc(100% - 48px));margin:auto}
header{height:72px;border-bottom:1px solid var(--border);display:flex;align-items:center;background:rgba(246,242,233,.96)}.nav{display:flex;justify-content:space-between;align-items:center}.logo,h1,h2{font-family:"DM Serif Display";font-weight:400}.logo{font-size:30px}.nav-actions{display:flex;align-items:center;gap:28px;font-size:13px}.nav-actions a:hover{text-decoration:underline;text-underline-offset:4px}
.cat-menu-wrap{position:relative}.cat-menu-btn{border:0;background:none;color:var(--ink);font:13px Manrope;cursor:pointer;padding:8px 0;display:inline-flex;align-items:center;gap:6px}.cat-menu-btn svg{width:13px;height:13px;display:block;transition:transform .18s ease}.cat-menu-btn[aria-expanded="true"] svg{transform:rotate(180deg)}.cat-menu{display:none;position:absolute;right:0;top:38px;width:min(720px,calc(100vw - 28px));background:var(--paper);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 45px rgba(41,39,36,.12);padding:22px;z-index:50}.cat-menu.open{display:block}.cat-menu-title{font-family:"DM Serif Display";font-size:24px;margin-bottom:16px}.cat-menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.cat-menu-col>a{display:block;font-size:13px;font-weight:700;margin-bottom:8px}.cat-menu-col a.topic-link{font-weight:400;color:var(--muted);font-size:12px;margin:5px 0}.cat-menu-col a:hover{color:var(--sage-dark)}
.page{padding:42px 0 70px}.crumb{font-size:11px;color:var(--muted);margin-bottom:25px}.crumb a{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:52px;align-items:start}.visual-wrap{display:grid;grid-template-columns:54px minmax(0,1fr);gap:14px;align-items:start}.thumbs{display:flex;flex-direction:column;gap:9px}.thumb{width:54px;height:68px;background:var(--paper);border:1px solid var(--border);border-radius:7px;overflow:hidden;cursor:pointer;padding:0}.thumb.active{border:2px solid var(--sage-dark)}.thumb img{width:100%;height:100%;object-fit:cover}.preview{background:var(--paper);border:1px solid var(--border);min-height:580px;display:flex;align-items:center;justify-content:center;padding:20px}.preview img{display:block;width:100%;height:auto;max-height:730px;object-fit:contain}.placeholder{color:var(--muted);font-size:12px}.info{padding-top:2px}.eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(42px,5vw,62px);line-height:1;letter-spacing:-1px;margin:13px 0 18px}.desc{color:var(--muted);font-size:14px;line-height:1.8}.meta{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}.pill{border:1px solid var(--border);background:var(--paper);border-radius:999px;padding:7px 11px;font-size:10px}.download{display:block;text-align:center;background:var(--sage-dark);color:#fff;border-radius:999px;padding:14px 20px;font-size:13px;font-weight:700;margin:23px 0 9px;box-shadow:0 10px 25px rgba(82,105,92,.16)}.file-note,.note{font-size:11px;color:var(--muted);text-align:center}.share{display:block;width:100%;border:1px solid var(--border);background:var(--paper);color:var(--ink);border-radius:999px;padding:12px;font:600 12px Manrope;cursor:pointer}.related{border-top:1px solid var(--border);padding:35px 0 75px}.related h2{font-size:30px;margin:0 0 18px}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}.card-img{aspect-ratio:.72;background:var(--paper);border:1px solid var(--border);border-radius:8px;overflow:hidden;display:grid;place-items:center}.card-img img{width:100%;height:100%;object-fit:contain}.card-title{font-family:"DM Serif Display";font-size:17px;margin-top:9px}.card-meta{font-size:10px;color:var(--muted)}.empty{text-align:center;padding:70px 0;color:var(--muted)}footer{border-top:1px solid var(--border);background:var(--sand);padding:30px 0}.foot{display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:11px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.info{padding-top:0}.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.container{width:calc(100% - 28px)}header{height:62px}.logo{font-size:25px}.nav-actions{gap:14px}.visual-wrap{grid-template-columns:1fr}.thumbs{order:2;flex-direction:row;overflow:auto}.thumb{flex:0 0 60px}.preview{min-height:420px}.cards{grid-template-columns:1fr 1fr}.foot{flex-direction:column}}
</style>
</head>
<body>
<header><div class="container nav"><a class="logo" href="/">EliasArts</a><nav class="nav-actions"><a href="/search">Search</a><div class="cat-menu-wrap"><button class="cat-menu-btn" id="catMenuBtn" type="button" aria-expanded="false">Categories <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button><div class="cat-menu" id="catMenu"><div class="cat-menu-title">Browse categories</div><div id="catMenuGrid" class="cat-menu-grid"></div></div></div><a href="/info.html?page=about">About</a></nav></div></header>
<main class="container page" id="page"><div id="content"></div></main>
<footer><div class="container foot"><span>EliasArts · Free printables for a more creative everyday.</span><span><a href="/">Home</a> · <a href="/search">Search</a> · <a href="/info.html?page=contact">Contact</a></span></div></footer>
<script>
const root=document.getElementById('content'),slug=new URLSearchParams(location.search).get('slug')||'';
const esc=s=>String(s??'').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
function relatedCard(p){return '<a href="/printable.html?slug='+encodeURIComponent(p.slug)+'"><div class="card-img">'+(p.cover_url?'<img loading="lazy" src="'+p.cover_url+'" alt="'+esc(p.title)+'">':'<span class="placeholder">Preview</span>')+'</div><div class="card-title">'+esc(p.title)+'</div><div class="card-meta">'+esc(p.topic_name||p.category_name||'Printable')+' · Free</div></a>'}
async function load(){
 if(!slug){root.innerHTML='<div class="empty"><h1>Printable unavailable.</h1><p>Choose a printable from Search or Categories.</p></div>';return}
 try{
  const r=await fetch('/api/printables/'+encodeURIComponent(slug));if(!r.ok)throw Error();
  const p=await r.json();document.title=p.title+' — Elias Arts';
  const files=p.files||[],previews=files.filter(f=>f.file_type==='preview'||f.file_type==='page'),cover=files.find(f=>f.file_type==='cover')||previews[0],pdf=files.find(f=>f.file_type==='pdf');
  const allImages=[...(cover?[cover]:[]),...previews.filter(f=>!cover||f.id!==cover.id)];
  root.innerHTML='<div class="crumb"><a href="/">Home</a> / <a href="/search">Printables</a> / '+esc(p.title)+'</div><div class="layout"><div class="visual-wrap"><div class="thumbs" id="thumbs">'+allImages.map((f,i)=>'<button class="thumb '+(i===0?'active':'')+'" data-src="'+f.url+'"><img loading="'+(i===0?'eager':'lazy')+'" src="'+f.url+'" alt="Preview '+(i+1)+'"></button>').join('')+'</div><div class="preview">'+(cover||previews[0]?'<img id="mainImg" loading="eager" src="'+(cover||previews[0]).url+'" alt="'+esc(p.title)+'">':'<span class="placeholder">Preview coming soon</span>')+'</div></div><article class="info"><div class="eyebrow">'+esc(p.category_name||'Free printable')+(p.topic_name?' · '+esc(p.topic_name):'')+'</div><h1>'+esc(p.title)+'</h1><div class="desc">'+esc(p.description||'A free printable from Elias Arts.')+'</div><div class="meta"><span class="pill">A4</span><span class="pill">PDF</span><span class="pill">Free</span></div>'+(pdf?'<a class="download" href="/api/printables/'+encodeURIComponent(slug)+'/download">↓ &nbsp; Download Free PDF</a><div class="file-note">PDF · A4 · Free download</div>':'<div class="note">Download will be available soon.</div>')+'<button class="share" id="shareBtn">Share</button><div class="note" style="margin-top:10px">Free for personal use.</div></article></div>'+(p.related?.length?'<section class="related"><h2>You may also like</h2><div class="cards">'+p.related.map(relatedCard).join('')+'</div></section>':'');
  document.getElementById('thumbs')?.addEventListener('click',e=>{const b=e.target.closest('.thumb');if(!b)return;const img=document.getElementById('mainImg');if(img)img.src=b.dataset.src;document.querySelectorAll('.thumb').forEach(x=>x.classList.toggle('active',x===b))});
  document.getElementById('shareBtn')?.addEventListener('click',async()=>{try{if(navigator.share){await navigator.share({title:p.title,url:location.href})}else{await navigator.clipboard.writeText(location.href);alert('Link copied.')};}catch(e){}});
 }catch(e){root.innerHTML='<div class="empty"><h1>Printable unavailable.</h1><p>We could not load this printable right now.</p><a href="/search" style="text-decoration:underline">Browse printables</a></div>'}
}
async function loadCategoryMenu(){try{const[a,b]=await Promise.all([fetch('/api/categories'),fetch('/api/topics')]);if(!a.ok||!b.ok)throw Error();const cats=await a.json(),topics=await b.json(),by={};topics.forEach(t=>(by[t.category_id]??=[]).push(t));const grid=document.getElementById('catMenuGrid');if(grid)grid.innerHTML=cats.map(c=>'<div class="cat-menu-col"><a href="/category.html?slug='+encodeURIComponent(c.slug)+'">'+esc(c.name)+'</a>'+((by[c.id]||[]).map(t=>'<a class="topic-link" href="/search?q='+encodeURIComponent(t.name)+'">'+esc(t.name)+'</a>').join(''))+'</div>').join('')}catch(e){console.error(e)}}const cmb=document.getElementById('catMenuBtn'),cm=document.getElementById('catMenu');cmb?.addEventListener('click',e=>{e.stopPropagation();const open=cm.classList.toggle('open');cmb.setAttribute('aria-expanded',open?'true':'false')});document.addEventListener('click',()=>{cm?.classList.remove('open');cmb?.setAttribute('aria-expanded','false')});loadCategoryMenu();load();
</script></body></html>
