<style>

*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:Manrope,sans-serif;line-height:1.5}a{text-decoration:none;color:inherit}.container{width:min(1280px,calc(100% - 48px));margin:auto}

.cat-menu-wrap{position:relative}.cat-menu-btn{border:0;background:none;color:var(--ink);font:13px Manrope;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:6px}.cat-menu-btn svg{width:13px;height:13px;display:block;transition:transform .18s ease}.cat-menu-btn[aria-expanded="true"] svg{transform:rotate(180deg)}.cat-menu{display:none;position:absolute;right:0;top:42px;width:min(720px,calc(100vw - 28px));background:var(--paper);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 45px rgba(41,39,36,.12);padding:22px;z-index:50}.cat-menu.open{display:block}.cat-menu-title{font-family:"DM Serif Display";font-size:24px;margin-bottom:16px}.cat-menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.cat-menu-col>a{display:block;font-size:13px;font-weight:700;margin-bottom:8px}.cat-menu-col a.topic-link{font-weight:400;color:var(--muted);font-size:12px;margin:5px 0}.cat-menu-col a:hover{color:var(--sage-dark)}
.page{padding:56px 0 110px}.page-loading{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:52px;min-height:580px}.loading-preview{min-height:580px;border:1px solid var(--border);border-radius:10px;background:linear-gradient(110deg,var(--paper) 8%,#f3eee4 18%,var(--paper) 33%);background-size:200% 100%;animation:shine 1.2s linear infinite}.loading-copy{padding-top:25px}.loading-copy span{display:block;height:18px;border-radius:8px;background:var(--sand);margin:12px 0}.loading-copy span:nth-child(1){width:42%;height:11px}.loading-copy span:nth-child(2){width:90%;height:70px}.loading-copy span:nth-child(3){width:100%;height:85px}.loading-copy span:nth-child(4){width:100%;height:52px}@keyframes shine{to{background-position:-200% 0}}.crumb{font-size:11px;color:var(--muted);margin-bottom:25px}.crumb a{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:52px;align-items:start}.visual-wrap{display:grid;grid-template-columns:54px minmax(0,1fr);gap:14px;align-items:start}.thumbs{display:flex;flex-direction:column;gap:9px}.thumbs.single{display:flex}.visual-wrap:has(.thumbs.single){grid-template-columns:54px minmax(0,1fr)}.thumb{width:54px;height:68px;background:var(--paper);border:1px solid var(--border);border-radius:7px;overflow:hidden;cursor:pointer;padding:0}.thumb.active{border:2px solid var(--sage-dark)}.thumb img{width:100%;height:100%;object-fit:cover}.preview-shell{position:relative;min-width:0}.preview{aspect-ratio:210/297;background:var(--paper);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden;position:relative;border-radius:10px}.preview img{display:block;width:100%;height:100%;object-fit:contain}.placeholder{color:var(--muted);font-size:12px}.slide-btn{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border:1px solid rgba(212,205,193,.95);background:rgba(252,251,247,.94);color:var(--ink);border-radius:50%;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 22px rgba(41,39,36,.12);transition:transform .15s ease,opacity .15s ease,background .15s ease;z-index:2}.slide-btn:hover:not(:disabled){transform:translateY(-50%) scale(1.04);background:#fff}.slide-btn:disabled{opacity:.45;cursor:default}.slide-btn.prev{left:14px}.slide-btn.next{right:14px}.slide-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.slide-controls{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:10px}.slide-count{font-size:10px;color:var(--muted);letter-spacing:.4px}.slide-caption{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.related{margin-top:30px;padding:30px;background:var(--paper);border:1px solid var(--border);border-radius:16px}.related-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:22px}.related-title-wrap h2{font-size:36px;margin:0 0 6px}.related-title-wrap p{margin:0;color:var(--muted);font-size:12px}.related-all{font-size:11px;font-weight:700;color:var(--sage-dark);border-bottom:1px solid currentColor;padding-bottom:2px;white-space:nowrap}.related-cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px}.related-card{display:block}.related-card:hover .card-title{color:var(--sage-dark)}.info{padding-top:2px}.eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(42px,5vw,62px);line-height:1;letter-spacing:-1px;margin:13px 0 18px}.desc{color:var(--muted);font-size:14px;line-height:1.8}.meta{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}.pill{border:1px solid var(--border);background:var(--paper);border-radius:999px;padding:7px 11px;font-size:10px}.download{display:block;text-align:center;background:var(--sage-dark);color:#fff;border-radius:999px;padding:14px 20px;font-size:13px;font-weight:700;margin:23px 0 9px;box-shadow:0 10px 25px rgba(82,105,92,.16)}.file-note,.note{font-size:11px;color:var(--muted);text-align:center}.share{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);background:var(--paper);color:var(--ink);border-radius:999px;padding:12px;font:600 12px Manrope;cursor:pointer}.share svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}.category-browser{border-top:1px solid var(--border);margin-top:70px;padding:48px 0 0}.category-browser-head h2{font-size:34px;margin:7px 0 5px}.category-browser-head p{font-size:12px;color:var(--muted);margin:0}.category-pills{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:22px}.category-pill{background:var(--paper);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:block;transition:.18s}.category-pill:hover{transform:translateY(-2px);border-color:var(--sage-dark)}.category-banner{height:138px;background:var(--sand);overflow:hidden;display:flex;align-items:center;justify-content:center}.category-banner img{width:100%;height:100%;object-fit:cover}.category-banner-fallback{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}.category-pill-body{padding:11px 12px 12px}.category-pill-name{font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}.category-pill-name span{color:var(--sage-dark);font-size:14px}.category-pill-desc{font-size:9.5px;color:var(--muted);margin-top:3px;line-height:1.4}.card-img{aspect-ratio:210/297;background:var(--paper);border:1px solid var(--border);border-radius:8px;overflow:hidden;display:grid;place-items:center}.card-img img{width:100%;height:100%;object-fit:contain}.card-title{font-family:"DM Serif Display";font-size:17px;margin-top:9px}.card-meta{font-size:10px;color:var(--muted)}.empty{text-align:center;padding:70px 0;color:var(--muted)}.retry-link{display:inline-block;margin-top:12px;border:1px solid var(--border);padding:9px 14px;border-radius:999px;color:var(--ink)}footer{border-top:1px solid var(--border);background:var(--sand);padding:30px 0}.foot{display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:11px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.page-loading{grid-template-columns:1fr}.loading-preview{min-height:420px}.loading-copy{padding-top:0}.info{padding-top:0}.related-cards{grid-template-columns:repeat(3,minmax(0,1fr))}.related-head{align-items:start}.category-pills{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:620px){.container{width:calc(100% - 28px)}header{height:62px}.nav{min-height:62px}.logo{font-size:25px}.nav-actions{gap:16px}.visual-wrap{grid-template-columns:1fr}.thumbs{order:2;flex-direction:row;overflow:auto;padding-bottom:2px}.thumb{flex:0 0 60px}.preview{aspect-ratio:210/297;min-height:0}.slide-btn{width:34px;height:34px}.slide-btn.prev{left:10px}.slide-btn.next{right:10px}.slide-controls{margin-top:8px}.related{margin-top:22px;padding:22px 18px}.related-head{display:block}.related-all{display:inline-block;margin-top:10px}.related-cards{grid-template-columns:1fr 1fr}.category-pills{grid-template-columns:1fr 1fr}.category-banner{height:118px}.category-browser{margin-top:52px;padding-top:34px}.category-browser-head h2{font-size:28px}.foot{flex-direction:column}}
</style>
<style>.cat-menu-loading{font-size:12px;color:var(--muted);padding:8px 0}</style></head>
<body>
<header><div class="container nav"><a class="logo" href="/">EliasArts</a><nav class="nav-actions"><a class="search-link" href="/search"><svg class="nav-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.2 4.2"></path></svg><span>Search</span></a><div class="cat-menu-wrap"><button class="cat-menu-btn" id="catMenuBtn" type="button" aria-expanded="false">Categories <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button><div class="cat-menu" id="catMenu"><div class="cat-menu-title">Browse categories</div><div id="catMenuGrid" class="cat-menu-grid"></div></div></div></nav></div></header>
<main class="container page" id="page"><div id="content"><div class="page-loading" aria-label="Loading printable"><div class="loading-preview"></div><div class="loading-copy"><span></span><span></span><span></span><span></span></div></div></div></main>
<footer><div class="container foot"><span>EliasArts · Free printables for a more creative everyday.</span><span><a href="/">Home</a> · <a href="/search">Search</a> · <a href="/info.html?page=contact">Contact</a></span></div></footer>
<script>
const root=document.getElementById('content'),slug=new URLSearchParams(location.search).get('slug')||'';
const esc=s=>String(s??'').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
function relatedCard(p){return '<a href="/printable.html?slug='+encodeURIComponent(p.slug)+'"><div class="card-img">'+(p.cover_url?'<img loading="lazy" src="'+p.cover_url+'" alt="'+esc(p.title)+'">':'<span class="placeholder">Preview</span>')+'</div><div class="card-title">'+esc(p.title)+'</div><div class="card-meta">'+esc(p.topic_name||p.category_name||'Printable')+' · Free</div></a>'}
async function load(){
 if(window.__ELIAS_PRINTABLE_STARTED__)return;window.__ELIAS_PRINTABLE_STARTED__=true;
 if(!slug){root.innerHTML='<div class="empty"><h1>Printable unavailable.</h1><p>Choose a printable from Search or Categories.</p></div>';return}
 try{
  let p=window.__ELIAS_PRELOADED__;
  if(!p){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),8000);const r=await fetch('/api/printables/'+encodeURIComponent(slug),{signal:controller.signal,cache:'no-store'});clearTimeout(timer);if(!r.ok)throw Error();p=await r.json();}document.title=p.title+' — Elias Arts';let descMeta=document.querySelector('meta[name="description"]');if(descMeta)descMeta.content=(p.description||'Free printable from Elias Arts.')+' Free for personal use only.';let ogDesc=document.querySelector('meta[property="og:description"]');if(!ogDesc){ogDesc=document.createElement('meta');ogDesc.setAttribute('property','og:description');document.head.appendChild(ogDesc)}ogDesc.content=p.description||'Free printable from Elias Arts.';let ogImage=document.querySelector('meta[property="og:image"]');const firstImage=(p.files||[]).find(x=>x.file_type==='cover')?.url||(p.files||[]).find(x=>x.file_type==='preview'||x.file_type==='page')?.url;if(firstImage){if(!ogImage){ogImage=document.createElement('meta');ogImage.setAttribute('property','og:image');document.head.appendChild(ogImage)}ogImage.content=new URL(firstImage,location.origin).href}let canonical=document.querySelector('link[rel="canonical"]');if(!canonical){canonical=document.createElement('link');canonical.rel='canonical';document.head.appendChild(canonical)}canonical.href=location.href;let og=document.querySelector('meta[property="og:title"]');if(!og){og=document.createElement('meta');og.setAttribute('property','og:title');document.head.appendChild(og)}og.content=p.title;
  const files=p.files||[],previews=files.filter(f=>f.file_type==='preview'||f.file_type==='page'),cover=files.find(f=>f.file_type==='cover')||previews[0],pdf=files.find(f=>f.file_type==='pdf');
  const allImages=[];
  for(const f of [cover,...previews]){
   if(!f)continue;
   if(allImages.some(x=>x.storage_key===f.storage_key))continue;
   if(f.original_name&&allImages.some(x=>x.original_name===f.original_name))continue;
   allImages.push(f);
  }
  const imageCount=allImages.length;
  const slideLabel=(f,i)=>f?.page_number!=null?'Page '+f.page_number:(i===0&&f?.file_type==='cover'?'Cover':'Preview '+(i+1));
  const relatedSection=p.related?.length?'<section class="related" aria-labelledby="relatedHeading"><div class="related-head"><div class="related-title-wrap"><div class="eyebrow">Recommended for you</div><h2 id="relatedHeading">More like it</h2><p>Discover more printables in the same style or collection.</p></div><a class="related-all" href="/search?q='+encodeURIComponent(p.title)+'&topic='+encodeURIComponent(p.topic_name||'')+'&category='+encodeURIComponent(p.category_name||'')+'&from='+encodeURIComponent(slug)+'">View all printables →</a></div><div class="related-cards">'+p.related.slice(0,8).map(x=>relatedCard(x).replace('<a ','<a class="related-card" ')).join('')+'</div></section>':'';
  const categoryNav='<section class="category-browser" aria-labelledby="categoryBrowserHeading"><div class="category-browser-head"><div><div class="eyebrow">Explore the library</div><h2 id="categoryBrowserHeading">Browse by category</h2><p>Find another collection and keep exploring Elias Arts.</p></div></div><div class="category-pills">'+
  (p.categories||[]).map(c=>'<a class="category-pill" href="/category.html?slug='+encodeURIComponent(c.slug)+'"><div class="category-banner">'+(c.visual_key?'<img loading="lazy" src="'+esc(fileUrl(c.visual_key))+'" alt="'+esc(c.name)+' category">'+ '<span class="category-banner-fallback" style="display:none"></span>':'<span class="category-banner-fallback">Elias Arts Collection</span>')+'</div><div class="category-pill-body"><div class="category-pill-name">'+esc(c.name)+'<span>→</span></div>'+(c.description?'<div class="category-pill-desc">'+esc(c.description)+'</div>':'')+'</div></a>').join('')+
  '</div></section>';
  root.innerHTML='<div class="crumb"><a href="/">Home</a> / <a href="/search">Printables</a> / '+esc(p.title)+'</div><div class="layout"><div class="visual-wrap"><div class="thumbs" id="thumbs">'+allImages.map((f,i)=>'<button class="thumb '+(i===0?'active':'')+'" data-index="'+i+'" type="button" aria-label="Show '+slideLabel(f,i)+'"><img loading="'+(i===0?'eager':'lazy')+'" src="'+esc(f.url)+'" alt="'+esc(p.title)+' — '+esc(slideLabel(f,i))+'"></button>').join('')+'</div><div class="preview-shell"><div class="preview">'+(cover||previews[0]?'<img id="mainImg" loading="eager" decoding="async" src="'+esc((cover||previews[0]).url)+'" alt="'+esc(p.title)+' — '+esc(slideLabel(cover||previews[0],0))+'">':'<span class="placeholder">Preview coming soon</span>')+'<button class="slide-btn prev" id="prevSlide" type="button" aria-label="Previous preview">'+
'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6-6 6 6 6"></path></svg></button><button class="slide-btn next" id="nextSlide" type="button" aria-label="Next preview">'+
'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"></path></svg></button></div><div class="slide-controls"><span class="slide-count" id="slideCount">'+(imageCount?('1 / '+imageCount):'0 / 0')+'</span><span class="slide-caption" id="slideCaption">'+(imageCount?esc(slideLabel(allImages[0],0)):'No preview available')+'</span></div></div></div><article class="info"><div class="eyebrow">'+esc(p.category_name||'Free printable')+(p.topic_name?' · '+esc(p.topic_name):'')+'</div><h1>'+esc(p.title)+'</h1><div class="desc">'+esc(p.description||'A free printable from Elias Arts.')+'</div><div class="meta"><span class="pill">'+esc(p.paper_size||'A4')+'</span><span class="pill">'+esc(p.format_info||'PDF')+'</span><span class="pill">Free</span><span class="pill">'+(Number(p.page_count)||1)+' page'+((Number(p.page_count)||1)===1?'':'s')+'</span></div>'+(pdf?'<a class="download" href="/api/printables/'+encodeURIComponent(slug)+'/download">↓ &nbsp; Download Free PDF</a>':'<div class="note">Download will be available soon.</div>')+'<button class="share" id="shareBtn" type="button" aria-label="Share printable"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>Share</button><div class="note" style="margin-top:10px">Free for personal use only.</div></div>'+relatedSection+categoryNav;
  let slideIndex=0;
  const mainImg=document.getElementById('mainImg');
  const thumbsEl=document.getElementById('thumbs');
  const countEl=document.getElementById('slideCount');
  const captionEl=document.getElementById('slideCaption');
  const prevBtn=document.getElementById('prevSlide');
  const nextBtn=document.getElementById('nextSlide');
  const setSlide=i=>{
   if(!allImages.length||!mainImg)return;
   slideIndex=(i+allImages.length)%allImages.length;
   const f=allImages[slideIndex];
   mainImg.src=f.url;
   mainImg.alt=p.title+' — '+slideLabel(f,slideIndex);
   if(countEl)countEl.textContent=(slideIndex+1)+' / '+allImages.length;
   if(captionEl)captionEl.textContent=slideLabel(f,slideIndex);
   document.querySelectorAll('.thumb').forEach((x,n)=>x.classList.toggle('active',n===slideIndex));
   if(prevBtn)prevBtn.disabled=allImages.length<=1;
   if(nextBtn)nextBtn.disabled=allImages.length<=1;
  };
  prevBtn?.addEventListener('click',()=>setSlide(slideIndex-1));
  nextBtn?.addEventListener('click',()=>setSlide(slideIndex+1));
  thumbsEl?.addEventListener('click',e=>{const b=e.target.closest('.thumb');if(!b)return;setSlide(Number(b.dataset.index)||0)});
  setSlide(0);
  document.getElementById('shareBtn')?.addEventListener('click',async()=>{try{if(navigator.share){await navigator.share({title:p.title,url:location.href})}else{await navigator.clipboard.writeText(location.href);alert('Link copied.')};}catch(e){}});
 }catch(e){root.innerHTML='<div class="empty"><h1>Printable unavailable.</h1><p>We could not load this printable right now.</p><a href="/search" style="text-decoration:underline">Browse printables</a></div>'}
}

load();

let catMenuLoaded=false;
async function loadCategoryMenu(){
 if(catMenuLoaded)return;
 catMenuLoaded=true;
 const grid=document.getElementById('catMenuGrid');
 if(grid)grid.innerHTML='<div class="cat-menu-loading">Loading categories…</div>';
 try{
  const r=await fetch('/api/navigation');
  if(!r.ok)throw Error();
  const cats=await r.json();
  if(grid)grid.innerHTML=cats.map(c=>'<div class="cat-menu-col"><a href="/category.html?slug='+encodeURIComponent(c.slug)+'">'+esc(c.name)+'</a>'+c.topics.map(t=>'<a class="topic-link" href="/category.html?slug='+encodeURIComponent(c.slug)+'&topic='+encodeURIComponent(t.slug)+'">'+esc(t.name)+'</a>').join('')+'</div>').join('');
 }catch(e){
  catMenuLoaded=false;
  if(grid)grid.innerHTML='<div class="cat-menu-loading">Categories could not be loaded. Please try again.</div>';
 }
}
const cmb=document.getElementById('catMenuBtn'),cm=document.getElementById('catMenu');
cmb?.addEventListener('click',e=>{
 e.stopPropagation();
 const open=cm.classList.toggle('open');
 cmb.setAttribute('aria-expanded',open?'true':'false');
 if(open)loadCategoryMenu();
});
document.addEventListener('click',()=>{cm?.classList.remove('open');cmb?.setAttribute('aria-expanded','false')});
</script></body></html>
