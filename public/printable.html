<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Printable — Elias Arts</title><meta name="description" content="Free printable from Elias Arts."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--ivory:#f6f2e9;--sand:#eae3d7;--paper:#fcfbf7;--ink:#292724;--muted:#6b665e;--border:#d4cdc1;--sage:#7c9583;--sage-dark:#52695c;--terracotta:#b97c65}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:Manrope,sans-serif}a{text-decoration:none;color:inherit}.container{width:min(1180px,calc(100% - 40px));margin:auto}header{height:72px;border-bottom:1px solid var(--border);display:flex;align-items:center}.nav{display:flex;justify-content:space-between;align-items:center}.logo,h1,h2{font-family:"DM Serif Display";font-weight:400}.logo{font-size:30px}.nav-actions{display:flex;gap:25px;font-size:13px}.page{padding:50px 0 70px}.crumb{font-size:11px;color:var(--muted);margin-bottom:25px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:55px;align-items:start}.preview{background:var(--paper);border:1px solid var(--border);padding:18px;box-shadow:0 15px 35px #29272410}.preview img{width:100%;display:block;max-height:760px;object-fit:contain}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.gallery img{width:100%;aspect-ratio:.72;object-fit:cover;background:var(--paper);border:1px solid var(--border);cursor:pointer}.info h1{font-size:52px;line-height:1;margin:0 0 18px}.desc{color:var(--muted);font-size:14px;line-height:1.8}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.pill{font-size:10px;border:1px solid var(--border);padding:6px 10px;border-radius:999px;background:var(--paper)}.download{display:block;text-align:center;background:var(--sage-dark);color:#fff;border-radius:999px;padding:15px 20px;font-size:13px;font-weight:700;margin:25px 0 8px;box-shadow:0 8px 20px #52695c20}.file-note{font-size:11px;color:var(--muted);text-align:center;margin:0 0 15px}.share{display:block;text-align:center;border:1px solid var(--border);border-radius:999px;padding:12px;font-size:12px;background:var(--paper);cursor:pointer}.note{font-size:11px;color:var(--muted);text-align:center;margin-top:10px}.error{text-align:center;padding:100px 0}.error h1{font-size:48px}@media(max-width:850px){.layout{grid-template-columns:1fr}.info h1{font-size:44px}}@media(max-width:550px){.container{width:calc(100% - 28px)}.nav-actions{gap:13px}.logo{font-size:25px}.gallery{grid-template-columns:repeat(3,1fr)}}</style><style>.cat-menu-wrap{position:relative}.cat-menu-btn{border:0;background:none;color:var(--ink);font:13px Manrope;cursor:pointer;padding:8px 0;display:inline-flex;align-items:center;gap:6px}.cat-menu-btn svg{width:13px;height:13px;display:block;transition:transform .18s ease}.cat-menu-btn[aria-expanded="true"] svg{transform:rotate(180deg)}.cat-menu{display:none;position:absolute;right:0;top:38px;width:min(720px,calc(100vw - 28px));background:var(--paper);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 45px rgba(41,39,36,.12);padding:22px;z-index:50}.cat-menu.open{display:block}.cat-menu-title{font-family:"DM Serif Display";font-size:24px;margin-bottom:16px}.cat-menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.cat-menu-col>a{display:block;font-weight:700;font-size:13px;margin-bottom:8px}.cat-menu-col a.topic-link{font-weight:400;color:var(--muted);font-size:12px;margin:5px 0}.cat-menu-col a:hover{color:var(--sage-dark)}@media(max-width:700px){.cat-menu{right:-10px}.cat-menu-grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.cat-menu-grid{grid-template-columns:1fr}}</style></head><body><header><div class="container nav"><a class="logo" href="/">EliasArts</a><nav class="nav-actions"><a href="/search">Search</a><div class="cat-menu-wrap"><button class="cat-menu-btn" id="catMenuBtn" type="button" aria-expanded="false">Categories <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button><div class="cat-menu" id="catMenu"><div class="cat-menu-title">Browse all categories</div><div id="catMenuGrid" class="cat-menu-grid"></div></div></div></nav></div></header><main class="container page"><div id="content"></div></main><script>
const root=document.getElementById('content');const slug=decodeURIComponent(location.pathname.replace(/^\/printable\//,''));
async function load(){try{const r=await fetch('/api/printables/'+encodeURIComponent(slug));if(!r.ok)throw Error();const p=await r.json();document.title=p.title+' — Elias Arts';const previews=p.files.filter(f=>f.file_type==='preview'||f.file_type==='page');const cover=p.files.find(f=>f.file_type==='cover')||previews[0];const pdf=p.files.find(f=>f.file_type==='pdf');root.innerHTML='<div class="crumb"><a href="/">Home</a> / <a href="/search">Printables</a> / '+esc(p.title)+'</div><div class="layout"><div><div class="preview">'+(cover?'<img id="mainImg" src="'+cover.url+'" alt="'+esc(p.title)+'">':'<div style="padding:120px;text-align:center;color:var(--muted)">Preview coming soon</div>')+'</div>'+(previews.length?'<div class="gallery">'+previews.map(f=>'<img src="'+f.url+'" alt="Preview" onclick="document.getElementById(\'mainImg\').src=this.src">').join('')+'</div>':'')+'</div><article class="info"><div class="eyebrow" style="font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)">Free printable</div><h1>'+esc(p.title)+'</h1><div class="desc">'+esc(p.description||'A free printable from Elias Arts.')+'</div><div class="meta">'+(p.category_name?'<span class="pill">'+esc(p.category_name)+'</span>':'')+(p.topic_name?'<span class="pill">'+esc(p.topic_name)+'</span>':'')+'<span class="pill">PDF · A4</span></div>'+(pdf?'<a class="download" href="'+pdf.url+'" download>Download PDF →</a><div class="file-note">PDF · A4 · Free download</div>':'<div class="note">Download will be available soon.</div>')+'<button class="share" onclick="sharePage()">Share this printable</button><div class="note">Free for personal use.</div></article></div>'}catch(e){root.innerHTML='<div class="error"><h1>Printable not found.</h1><p class="desc">This printable may not be published yet.</p><a class="download" style="display:inline-block;width:auto" href="/">Return to Elias Arts</a></div>'}}
function esc(s){return String(s??'').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]))}
async function sharePage(){if(navigator.share){try{await navigator.share({title:document.title,url:location.href})}catch(e){}}else{await navigator.clipboard?.writeText(location.href);alert('Link copied.')}}load();
</script><script>async function loadCategoryMenu(){try{const [a,b]=await Promise.all([fetch('/api/categories'),fetch('/api/topics')]);if(!a.ok||!b.ok)throw Error();const cats=await a.json(),topics=await b.json(),by={};topics.forEach(t=>(by[t.category_id]??=[]).push(t));const grid=document.getElementById('catMenuGrid');if(grid)grid.innerHTML=cats.map(c=>'<div class="cat-menu-col"><a href="/category.html?slug='+encodeURIComponent(c.slug)+'">'+navEsc(c.name)+'</a>'+((by[c.id]||[]).map(t=>'<a class="topic-link" href="/search?q='+encodeURIComponent(t.name)+'">'+navEsc(t.name)+'</a>').join(''))+'</div>').join('')}catch(e){console.error(e)}}function navEsc(s){return String(s??'').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]))}const cmb=document.getElementById('catMenuBtn'),cm=document.getElementById('catMenu');cmb?.addEventListener('click',e=>{e.stopPropagation();const open=cm.classList.toggle('open');cmb.setAttribute('aria-expanded',open?'true':'false')});document.addEventListener('click',()=>{cm?.classList.remove('open');cmb?.setAttribute('aria-expanded','false')});loadCategoryMenu();</script></body></html>
