<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Category — Elias Arts</title>
<meta name="description" content="Browse free Elias Arts printables by category.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ivory:#f6f2e9;--sand:#eae3d7;--paper:#fcfbf7;--ink:#292724;--muted:#6b665e;--border:#d4cdc1;--sage:#7c9583;--sage-dark:#52695c}
*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:Manrope,sans-serif;line-height:1.5}a{text-decoration:none;color:inherit}.container{width:min(1320px,calc(100% - 48px));margin:auto}
header{height:72px;border-bottom:1px solid var(--border);display:flex;align-items:center;background:rgba(246,242,233,.96)}.nav{display:flex;align-items:center;justify-content:space-between}.logo,h1,h2{font-family:"DM Serif Display",serif;font-weight:400}.logo{font-size:30px}.nav-actions{display:flex;align-items:center;gap:28px;font-size:13px;height:100%}.nav-actions>a,.cat-menu-btn{height:40px;display:inline-flex;align-items:center;line-height:1}.nav-actions a:hover{text-decoration:none}.nav-actions a:focus-visible,.cat-menu-btn:focus-visible{outline:2px solid var(--sage-dark);outline-offset:4px;border-radius:4px}.search-link{gap:7px}.nav-search-icon{width:16px;height:16px;display:block;flex:0 0 16px}
.cat-menu-wrap{position:relative}.cat-menu-btn{border:0;background:none;color:var(--ink);font:13px Manrope;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:6px}.cat-menu-btn svg{width:13px;height:13px;display:block;transition:transform .18s ease}.cat-menu-btn[aria-expanded="true"] svg{transform:rotate(180deg)}.cat-menu{display:none;position:absolute;right:0;top:42px;width:min(720px,calc(100vw - 28px));background:var(--paper);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 45px rgba(41,39,36,.12);padding:22px;z-index:50}.cat-menu.open{display:block}.cat-menu-title{font-family:"DM Serif Display";font-size:24px;margin-bottom:16px}.cat-menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.cat-menu-col>a{display:block;font-size:13px;font-weight:700;margin-bottom:8px}.cat-menu-col a.topic-link{font-weight:400;color:var(--muted);font-size:12px;margin:5px 0}.cat-menu-col a:hover{color:var(--sage-dark)}
.hero{padding:42px 0 12px}.category-banner{width:min(100%,1100px);aspect-ratio:3.2;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--paper);margin:18px 0 28px}.category-banner img{width:100%;height:100%;object-fit:cover;display:block}.hero-loading{max-width:700px;margin-top:20px}.hero-loading span{display:block;background:var(--sand);border-radius:8px;height:14px;margin:12px 0}.hero-loading span:nth-child(1){width:160px}.hero-loading span:nth-child(2){height:72px;width:62%}.hero-loading span:nth-child(3){width:80%}.loading{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}.loading span{display:block;aspect-ratio:210/297;border:1px solid var(--border);border-radius:10px;background:linear-gradient(110deg,var(--paper) 8%,#f3eee4 18%,var(--paper) 33%);background-size:200% 100%;animation:shine 1.2s linear infinite}@keyframes shine{to{background-position:-200% 0}}.crumb{font-size:11px;color:var(--muted);margin-bottom:20px}.crumb a{color:var(--muted)}.eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(52px,6vw,76px);line-height:.98;letter-spacing:-1.5px;margin:12px 0 16px}.intro{font-size:14px;color:var(--muted);max-width:700px;line-height:1.8}.filter-row{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:28px}.chips{display:flex;flex-wrap:wrap;gap:9px}.chip{border:1px solid var(--border);background:var(--paper);color:var(--ink);border-radius:999px;padding:9px 15px;font:600 11px Manrope;cursor:pointer}.chip.active{background:var(--sage-dark);border-color:var(--sage-dark);color:#fff}.count{font-size:11px;color:var(--muted);white-space:nowrap}
.section{padding:28px 0 80px}.loading{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}.loading span{display:block;aspect-ratio:210/297;border:1px solid var(--border);border-radius:10px;background:linear-gradient(110deg,var(--paper) 8%,#f3eee4 18%,var(--paper) 33%);background-size:200% 100%;animation:shine 1.2s linear infinite}@keyframes shine{to{background-position:-200% 0}}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.section-head h2{font-size:34px;margin:0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}.card-img{aspect-ratio:210/297;background:var(--paper);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:grid;place-items:center}.card-img img{width:100%;height:100%;object-fit:contain}.placeholder{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}.title{font-family:"DM Serif Display";font-size:19px;margin-top:10px}.meta{font-size:10px;color:var(--muted);margin-top:2px}.desc{font-size:11px;color:var(--muted);line-height:1.45;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.empty{border:1px dashed var(--border);padding:60px;text-align:center;color:var(--muted);background:#fcfbf780}
footer{border-top:1px solid var(--border);background:var(--sand);padding:30px 0}.foot{display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:11px}.foot a:hover{text-decoration:underline;text-underline-offset:4px}
@media(max-width:900px){.filter-row{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.container{width:calc(100% - 28px)}header{height:62px}.logo{font-size:25px}.nav-actions{gap:14px}.cards{grid-template-columns:1fr 1fr}.foot{flex-direction:column}}
</style>
<meta name="robots" content="index,follow">
<meta property="og:type" content="website"><meta property="og:site_name" content="Elias Arts">
<style>.cat-menu-loading{font-size:12px;color:var(--muted);padding:8px 0}</style></head>
<body>
<header><div class="container nav"><a class="logo" href="/">EliasArts</a><nav class="nav-actions"><a class="search-link" href="/search"><svg class="nav-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.2 4.2"></path></svg><span>Search</span></a><div class="cat-menu-wrap"><button class="cat-menu-btn" id="catMenuBtn" type="button" aria-expanded="false">Categories <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button><div class="cat-menu" id="catMenu"><div class="cat-menu-title">Browse categories</div><div id="catMenuGrid" class="cat-menu-grid"></div></div></div></nav></div></header>
<main class="container">
<section class="hero" id="hero"><div class="crumb"><a href="/">Home</a> / <span id="crumb">Category</span></div><div class="hero-loading"><span></span><span></span><span></span></div><div id="categoryBanner" class="category-banner" hidden><img id="categoryBannerImg" src="" alt=""></div><div class="eyebrow" id="eyebrow" hidden>Browse category</div><h1 id="title" hidden></h1><div class="intro" id="intro" hidden></div><div class="filter-row" id="filterRow" hidden><div class="chips" id="chips"></div></div></section>
<section class="section"><div class="section-head"><h2>All printables</h2></div><div class="loading" id="loading"><span></span><span></span><span></span><span></span></div><div class="cards" id="results"></div><div class="empty" id="empty">No published printables in this category yet.</div></section>
</main>
<footer><div class="container foot"><span>EliasArts · Free printables for a more creative everyday.</span><span><a href="/">Home</a> · <a href="/search">Search</a> · <a href="/info.html?page=contact">Contact</a></span></div></footer>
<script>
const slug=new URLSearchParams(location.search).get('slug')||'';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
let data=null,active=new URLSearchParams(location.search).get('topic')||'all';
function card(p){return '<a class="card" href="/printable.html?slug='+encodeURIComponent(p.slug)+'"><div class="card-img">'+(p.cover_url?'<img loading="lazy" src="'+p.cover_url+'" alt="'+esc(p.title)+'">':'<span class="placeholder">Preview</span>')+'</div><div class="title">'+esc(p.title)+'</div><div class="meta">'+esc(p.topic_name||p.category_name||'Printable')+' · Free</div>'+(p.description?'<div class="desc">'+esc(p.description)+'</div>':'')+'</a>'}
function render(){$('loading').style.display='none';const topic=active==='all'?null:data.topics.find(t=>t.id===Number(active));const arr=topic?data.printables.filter(p=>p.topic_name===topic.name):data.printables;$('results').innerHTML=arr.map(card).join('');$('empty').style.display=arr.length?'none':'block'}
async function load(){
 if(!slug){$('loading').style.display='none';$('title').textContent='Choose a category';$('intro').textContent='Select a collection from the Categories menu above.';$('chips').innerHTML='';;return}
 try{data=window.__ELIAS_PRELOADED__;if(!data){const r=await fetch('/api/categories/'+encodeURIComponent(slug));if(!r.ok)throw Error();data=await r.json();}document.title=data.name+' Printables — Elias Arts';let canonical=document.querySelector('link[rel="canonical"]');if(!canonical){canonical=document.createElement('link');canonical.rel='canonical';document.head.appendChild(canonical)}canonical.href=location.href;let desc=document.querySelector('meta[name="description"]');if(desc)desc.content=(data.description||'Browse free printables from this collection.')+' Free downloads from Elias Arts.';$('crumb').textContent=data.name;$('eyebrow').hidden=false;if(data.banner_url){$('categoryBannerImg').src=data.banner_url;$('categoryBannerImg').alt=data.name+' printable collection';$('categoryBanner').hidden=false}$('title').hidden=false;$('intro').hidden=false;$('filterRow').hidden=false;$('hero').querySelector('.hero-loading').remove();$('title').textContent=data.name;$('intro').textContent=data.description||'Browse free printables from this collection.';const chips=[{id:'all',name:'All'},...data.topics];$('chips').innerHTML=chips.map(t=>'<button class="chip '+(t.id==='all'?'active':'')+'" data-id="'+t.id+'">'+esc(t.name)+'</button>').join('');const topicParam=new URLSearchParams(location.search).get('topic');if(topicParam){const found=data.topics.find(t=>t.slug===topicParam);active=found?String(found.id):'all';document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.id===active))}$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;active=String(b.dataset.id);document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));const u=new URL(location.href);if(active==='all')u.searchParams.delete('topic');else{const topic=data.topics.find(t=>String(t.id)===active);if(topic)u.searchParams.set('topic',topic.slug)}history.replaceState({},'',u);render()};render()
 }catch(e){$('loading').style.display='none';$('title').textContent='Category unavailable';$('intro').textContent='We could not load this collection right now.';$('chips').innerHTML=''}}
load();

let catMenuLoaded=false;
async function loadCategoryMenu(){
 if(catMenuLoaded)return;
 catMenuLoaded=true;
 const grid=document.getElementById('catMenuGrid');
 if(grid)grid.innerHTML='<div class="cat-menu-loading">Loading categories…</div>';
 try{
  const r=await fetch('/api/navigation');
  if(!r.ok)throw Error();
  const cats=await r.json();
  if(grid)grid.innerHTML=cats.map(c=>'<div class="cat-menu-col"><a href="/category.html?slug='+encodeURIComponent(c.slug)+'">'+esc(c.name)+'</a>'+c.topics.map(t=>'<a class="topic-link" href="/category.html?slug='+encodeURIComponent(c.slug)+'&topic='+encodeURIComponent(t.slug)+'">'+esc(t.name)+'</a>').join('')+'</div>').join('');
 }catch(e){
  catMenuLoaded=false;
  if(grid)grid.innerHTML='<div class="cat-menu-loading">Categories could not be loaded. Please try again.</div>';
 }
}
const cmb=document.getElementById('catMenuBtn'),cm=document.getElementById('catMenu');
cmb?.addEventListener('click',e=>{
 e.stopPropagation();
 const open=cm.classList.toggle('open');
 cmb.setAttribute('aria-expanded',open?'true':'false');
 if(open)loadCategoryMenu();
});
document.addEventListener('click',()=>{cm?.classList.remove('open');cmb?.setAttribute('aria-expanded','false')});
</script>
</body></html>
