<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Category — Elias Arts</title>
<meta name="description" content="Browse free printables by Elias Arts category.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ivory:#f6f2e9;--sand:#eae3d7;--paper:#fcfbf7;--ink:#292724;--muted:#6b665e;--border:#d4cdc1;--sage:#7c9583;--sage-dark:#52695c;--terracotta:#b97c65}
*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:Manrope,sans-serif;line-height:1.5}a{text-decoration:none;color:inherit}
.container{width:min(1280px,calc(100% - 48px));margin:auto}header{height:72px;border-bottom:1px solid var(--border);display:flex;align-items:center;background:rgba(246,242,233,.96);position:sticky;top:0;z-index:10}.nav{display:flex;justify-content:space-between;align-items:center}.logo,h1,h2,h3{font-family:"DM Serif Display";font-weight:400}.logo{font-size:30px}.nav-actions{display:flex;gap:25px;align-items:center;font-size:13px}.nav-actions a:hover{text-decoration:underline;text-underline-offset:4px}
.page{padding:48px 0 85px}.crumb{font-size:11px;color:var(--muted);margin-bottom:22px}.hero{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:45px;align-items:stretch}.eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(52px,6vw,78px);line-height:.98;letter-spacing:-1.5px;margin:14px 0 18px}.intro{font-size:15px;color:var(--muted);max-width:650px;line-height:1.8}.banner{min-height:270px;background:var(--sand);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center}.banner img{width:100%;height:100%;min-height:270px;object-fit:cover}.banner span{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.topics{display:flex;gap:9px;flex-wrap:wrap;margin-top:25px}.topic{border:1px solid var(--border);background:var(--paper);border-radius:999px;padding:8px 13px;font-size:11px}.topic:hover{border-color:var(--sage);color:var(--sage-dark)}
.section{padding-top:55px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.section-head h2{font-size:34px;margin:0}.section-head p{font-size:12px;color:var(--muted);margin:5px 0 0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.card{min-width:0}.card-img{aspect-ratio:.72;background:var(--paper);border:1px solid var(--border);border-radius:9px;overflow:hidden;display:grid;place-items:center}.card-img img{width:100%;height:100%;object-fit:contain}.placeholder{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}.title{font-family:"DM Serif Display";font-size:19px;margin-top:10px}.meta{font-size:10px;color:var(--muted);margin-top:2px}.desc{font-size:11px;color:var(--muted);line-height:1.45;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.empty{border:1px dashed var(--border);padding:50px;text-align:center;color:var(--muted);background:#fcfbf780}.error{text-align:center;padding:110px 0}.error h1{font-size:48px}.btn{display:inline-block;margin-top:20px;border:1px solid var(--border);border-radius:999px;padding:11px 18px;font-size:12px;background:var(--paper)}
footer{border-top:1px solid var(--border);background:var(--sand);padding:28px 0;margin-top:20px}.foot{display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:11px}.foot a:hover{text-decoration:underline}
@media(max-width:850px){.hero{grid-template-columns:1fr}.banner{min-height:220px}.banner img{min-height:220px}.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.container{width:calc(100% - 28px)}header{height:62px}.logo{font-size:25px}.nav-actions{gap:13px}.hero{gap:25px}.cards{grid-template-columns:1fr 1fr}.foot{flex-direction:column}}
</style>
<style>.cat-menu-wrap{position:relative}.cat-menu-btn{border:0;background:none;color:var(--ink);font:13px Manrope;cursor:pointer;padding:8px 0;display:inline-flex;align-items:center;gap:6px}.cat-menu-btn svg{width:13px;height:13px;display:block;transition:transform .18s ease}.cat-menu-btn[aria-expanded="true"] svg{transform:rotate(180deg)}.cat-menu{display:none;position:absolute;right:0;top:38px;width:min(720px,calc(100vw - 28px));background:var(--paper);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 45px rgba(41,39,36,.12);padding:22px;z-index:50}.cat-menu.open{display:block}.cat-menu-title{font-family:"DM Serif Display";font-size:24px;margin-bottom:16px}.cat-menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.cat-menu-col>a{display:block;font-weight:700;font-size:13px;margin-bottom:8px}.cat-menu-col a.topic-link{font-weight:400;color:var(--muted);font-size:12px;margin:5px 0}.cat-menu-col a:hover{color:var(--sage-dark)}@media(max-width:700px){.cat-menu{right:-10px}.cat-menu-grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.cat-menu-grid{grid-template-columns:1fr}}</style></head>
<body>
<header><div class="container nav"><a class="logo" href="/">EliasArts</a><nav class="nav-actions"><a href="/search">Search</a><div class="cat-menu-wrap"><button class="cat-menu-btn" id="catMenuBtn" type="button" aria-expanded="false">Categories <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button><div class="cat-menu" id="catMenu"><div class="cat-menu-title">Browse all categories</div><div id="catMenuGrid" class="cat-menu-grid"></div></div></div></nav></div></header>
<main class="container page" id="page">
<div class="crumb"><a href="/">Home</a> / <span id="crumb">Category</span></div>
<div id="content"></div>
</main>
<footer><div class="container foot"><span>EliasArts · Free printables for a more creative everyday.</span><span><a href="/">Home</a> · <a href="/search">Search</a> · <a href="/info.html?page=about">About</a> · <a href="/info.html?page=contact">Contact</a></span></div></footer>
<script>
const root=document.getElementById('content');
const pathName=location.pathname; const slug=(pathName==='/category'||pathName==='/category/')?'':decodeURIComponent(pathName.slice('/category/'.length).replace(/\/$/,''));
const esc=s=>String(s??'').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
function card(p){return '<a class="card" href="/printable.html?slug='+encodeURIComponent(p.slug)+'"><div class="card-img">'+(p.cover_url?'<img src="'+p.cover_url+'" alt="'+esc(p.title)+'">':'<span class="placeholder">Preview</span>')+'</div><div class="title">'+esc(p.title)+'</div><div class="meta">'+esc(p.topic_name||'Printable')+' · Free</div>'+(p.description?'<div class="desc">'+esc(p.description)+'</div>':'')+'</a>'}
async function load(){
 try{
  if(!slug){
   const r=await fetch('/api/categories'); if(!r.ok)throw Error();
   const cats=await r.json(); document.title='Categories — Elias Arts'; document.getElementById('crumb').textContent='Categories';
   root.innerHTML='<section><div class="eyebrow">Elias Arts library</div><h1>Browse categories.</h1><div class="intro">Explore every Elias Arts collection and discover its topics and free printables.</div></section><section class="section"><div class="cards">'+cats.map(x=>'<a class="card" href="/category/'+encodeURIComponent(x.slug)+'"><div class="card-img"><span class="placeholder">Collection</span></div><div class="title">'+esc(x.name)+'</div><div class="desc">'+esc(x.description||'Browse this collection.')+'</div></a>').join('')+'</div></section>';
   return;
  }
  const r=await fetch('/api/categories/'+encodeURIComponent(slug)); if(!r.ok)throw Error();
  const c=await r.json(); document.title=c.name+' Printables — Elias Arts'; document.getElementById('crumb').textContent=c.name;
  const topicHtml=c.topics.length?'<div class="topics">'+c.topics.map(t=>'<a class="topic" href="/search?q='+encodeURIComponent(t.name)+'">'+esc(t.name)+'</a>').join('')+'</div>':'';
  root.innerHTML='<section class="hero"><div><div class="eyebrow">Elias Arts collection</div><h1>'+esc(c.name)+'</h1><div class="intro">'+esc(c.description||'Browse free printables from this collection.')+'</div>'+topicHtml+'</div><div class="banner">'+(c.banner_url?'<img src="'+c.banner_url+'" alt="'+esc(c.name)+' collection">':'<span>Collection</span>')+'</div></section><section class="section"><div class="section-head"><div><h2>Printables in this collection</h2><p>'+c.printables.length+' printable'+(c.printables.length===1?'':'s')+'</p></div></div>'+(c.printables.length?'<div class="cards">'+c.printables.map(card).join('')+'</div>':'<div class="empty">No published printables in this collection yet.<br><a class="btn" href="/search">Browse the full library →</a></div>')+'</section>';
 }catch(e){root.innerHTML='<div class="error"><h1>Category not found.</h1><p class="intro">This collection may not exist yet.</p><a class="btn" href="/">Return to Elias Arts</a></div>'}
}
load();
</script>
<script>async function loadCategoryMenu(){try{const [a,b]=await Promise.all([fetch('/api/categories'),fetch('/api/topics')]);if(!a.ok||!b.ok)throw Error();const cats=await a.json(),topics=await b.json(),by={};topics.forEach(t=>(by[t.category_id]??=[]).push(t));const grid=document.getElementById('catMenuGrid');if(grid)grid.innerHTML=cats.map(c=>'<div class="cat-menu-col"><a href="/category.html?slug='+encodeURIComponent(c.slug)+'">'+navEsc(c.name)+'</a>'+((by[c.id]||[]).map(t=>'<a class="topic-link" href="/search?q='+encodeURIComponent(t.name)+'">'+navEsc(t.name)+'</a>').join(''))+'</div>').join('')}catch(e){console.error(e)}}function navEsc(s){return String(s??'').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]))}const cmb=document.getElementById('catMenuBtn'),cm=document.getElementById('catMenu');cmb?.addEventListener('click',e=>{e.stopPropagation();const open=cm.classList.toggle('open');cmb.setAttribute('aria-expanded',open?'true':'false')});document.addEventListener('click',()=>{cm?.classList.remove('open');cmb?.setAttribute('aria-expanded','false')});loadCategoryMenu();</script></body>
</html>
