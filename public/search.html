<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search Printables — Elias Arts</title>
<meta name="description" content="Search the Elias Arts free printable library.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ivory:#f6f2e9;--sand:#eae3d7;--paper:#fcfbf7;--ink:#292724;--muted:#6b665e;--border:#d4cdc1;--sage:#7c9583;--sage-dark:#52695c}
*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:Manrope,sans-serif}a{text-decoration:none;color:inherit}.container{width:min(1380px,calc(100% - 48px));margin:auto}header{height:72px;border-bottom:1px solid var(--border);display:flex;align-items:center;background:rgba(246,242,233,.96)}.nav{display:flex;justify-content:space-between;align-items:center}.logo,h1,h2{font-family:"DM Serif Display";font-weight:400}.logo{font-size:30px}.nav-actions{display:flex;gap:28px;font-size:13px;align-items:center}.search-link{display:flex;align-items:center;gap:7px}.search-icon{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 18px}.search-icon svg{width:18px;height:18px;display:block;stroke-width:1.8}.hero{padding:58px 0 30px}.crumb{font-size:11px;color:var(--muted);margin-bottom:18px}.eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}h1{font-size:58px;line-height:1;margin:12px 0}.intro{color:var(--muted);font-size:14px}.search-box{display:flex;align-items:center;gap:10px;margin-top:26px;background:var(--paper);border:1px solid var(--border);border-radius:999px;padding:7px 8px 7px 18px;box-shadow:0 8px 24px #29272408}.search-box input{flex:1;border:0;outline:0;background:transparent;font:14px Manrope}.search-btn{border:0;background:var(--sage-dark);color:#fff;border-radius:999px;padding:12px 24px;font:600 12px Manrope}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 34px}.chip{border:1px solid var(--border);background:var(--paper);border-radius:999px;padding:7px 12px;font-size:10px}.results-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.results-head h2{font-size:28px;margin:0}.count{font-size:11px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:22px}.card-img{aspect-ratio:.72;background:var(--paper);border:1px solid var(--border);border-radius:8px;display:grid;place-items:center;overflow:hidden}.card-img svg{width:82%;height:88%}.title{font-family:"DM Serif Display";font-size:17px;margin-top:9px}.result-desc{font-size:11px;color:var(--muted);line-height:1.45;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:10px;color:var(--muted)}.empty{padding:55px 0;text-align:center;color:var(--muted);display:none}.crumb a{text-decoration:underline;text-underline-offset:3px}.footer{margin-top:70px;border-top:1px solid var(--border);padding:28px 0;background:var(--sand)}.foot{display:flex;justify-content:space-between;gap:20px;font-size:11px;color:var(--muted)}
@media(max-width:900px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.container{width:calc(100% - 28px)}header{height:62px}.logo{font-size:25px}.nav-actions{gap:14px}.hero{padding-top:40px}h1{font-size:46px}.cards{grid-template-columns:1fr 1fr}.foot{flex-direction:column}}
</style></head>
<body>
<header><div class="container nav"><a class="logo" href="/">EliasArts</a><nav class="nav-actions"><a class="search-link" href="/search"><span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/></svg></span><span>Search</span></a><a href="/#categories">Categories</a></nav></div></header>
<main class="container">
<section class="hero"><div class="crumb"><a href="/">Home</a> / Search</div><div class="eyebrow">Search printables</div><h1>Search printables.</h1><div class="intro">Find the perfect printable for your project, mood or occasion.</div>
<form class="search-box" id="searchForm"><span>⌕</span><input id="q" type="search" placeholder="Search printables..." autocomplete="off"><button class="search-btn">Search</button></form>
<div class="chips"><button class="chip" data-q="Coloring">Coloring</button><button class="chip" data-q="Cards">Cards</button><button class="chip" data-q="Wall Art">Wall Art</button><button class="chip" data-q="Planners">Planners</button><button class="chip" data-q="Calendars">Calendars</button></div></section>
<section><div class="results-head"><h2 id="heading">Latest results</h2><span class="count" id="count"></span></div><div class="cards" id="results"></div><div class="empty" id="empty">No matching printables yet.</div></section>
</main>
<footer class="footer"><div class="container foot"><span>EliasArts · Free printables for a more creative everyday.</span><span><a href="/">Home</a> · <a href="/#categories">Categories</a> · <a href="/about">About</a> · <a href="/contact">Contact</a> · <a href="/privacy">Privacy Policy</a></span></div></footer>
<script>
const form=document.getElementById('searchForm'),q=document.getElementById('q'),results=document.getElementById('results'),empty=document.getElementById('empty'),heading=document.getElementById('heading'),count=document.getElementById('count');
function card(p){return '<a href="/printable/'+encodeURIComponent(p.slug)+'"><div class="card-img"><svg viewBox="0 0 100 140" fill="none" stroke="#52695c" stroke-width="1.4"><rect x="10" y="6" width="80" height="128" rx="2" fill="#fcfbf7" stroke="#d4cdc1"/><circle cx="50" cy="60" r="26"/><path d="M28 101c12-11 32-11 44 0M34 46l16-13 16 13M36 72c8-8 20-8 28 0"/></svg></div><div class="title">'+p.title+'</div><div class="meta">'+(p.topic_name||p.category_name||'Free')+' · Free</div></a>'}
async function run(value){const term=value.trim();q.value=term;let data=[];try{if(term){const r=await fetch('/api/search?q='+encodeURIComponent(term));if(!r.ok)throw Error('Search is temporarily unavailable.');data=await r.json();heading.textContent='Search results for "'+term+'"'}else{const r=await fetch('/api/printables');if(!r.ok)throw Error('The printable library is temporarily unavailable.');data=await r.json();heading.textContent='Latest results'}results.innerHTML=data.map(card).join('');count.textContent=data.length+' result'+(data.length===1?'':'s');empty.style.display=data.length?'none':'block';}catch(e){results.innerHTML='';count.textContent='';empty.textContent=e.message;empty.style.display='block'}}
form.addEventListener('submit',e=>{e.preventDefault();run(q.value)});document.querySelectorAll('.chip').forEach(x=>x.addEventListener('click',()=>run(x.dataset.q)));const initial=new URLSearchParams(location.search).get('q')||'';run(initial);
</script>
</body></html>
