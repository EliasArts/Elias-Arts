<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search Printables — Elias Arts</title>
<meta name="description" content="Search the Elias Arts free printable library."><meta name="robots" content="noindex,follow"><link rel="canonical" href="https://elias-arts.eliasoscararts.workers.dev/search">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ivory:#f6f2e9;--sand:#eae3d7;--paper:#fcfbf7;--ink:#292724;--muted:#6b665e;--border:#d4cdc1;--sage:#7c9583;--sage-dark:#52695c}
*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:Manrope,sans-serif;line-height:1.5}a{text-decoration:none;color:inherit}.container{width:min(1320px,calc(100% - 48px));margin:auto}
header{height:72px;border-bottom:1px solid var(--border);display:flex;align-items:center;background:rgba(246,242,233,.96)}.nav{display:flex;align-items:center;justify-content:space-between}.logo,h1,h2{font-family:"DM Serif Display",serif;font-weight:400}.logo{font-size:30px}.nav-actions{display:flex;align-items:center;gap:28px;font-size:13px}.nav-actions a:hover{text-decoration:underline;text-underline-offset:4px}
.cat-menu-wrap{position:relative}.cat-menu-btn{border:0;background:none;color:var(--ink);font:13px Manrope;cursor:pointer;padding:8px 0;display:inline-flex;align-items:center;gap:6px}.cat-menu-btn svg{width:13px;height:13px;display:block;transition:transform .18s ease}.cat-menu-btn[aria-expanded="true"] svg{transform:rotate(180deg)}.cat-menu{display:none;position:absolute;right:0;top:38px;width:min(720px,calc(100vw - 28px));background:var(--paper);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 45px rgba(41,39,36,.12);padding:22px;z-index:50}.cat-menu.open{display:block}.cat-menu-title{font-family:"DM Serif Display";font-size:24px;margin-bottom:16px}.cat-menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.cat-menu-col>a{display:block;font-size:13px;font-weight:700;margin-bottom:8px}.cat-menu-col a.topic-link{font-weight:400;color:var(--muted);font-size:12px;margin:5px 0}.cat-menu-col a:hover{color:var(--sage-dark)}
.hero{padding:44px 0 26px}.crumb{font-size:11px;color:var(--muted);margin-bottom:20px}.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{text-decoration:underline;text-underline-offset:3px}.eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(50px,6vw,68px);line-height:1;margin:12px 0 16px;letter-spacing:-1px}.intro{font-size:14px;color:var(--muted)}
.search-box{display:flex;align-items:center;gap:8px;margin-top:26px;background:var(--paper);border:1px solid var(--border);border-radius:999px;padding:7px 8px 7px 18px}.search-box input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:14px Manrope;color:var(--ink)}.search-btn{border:0;background:var(--sage-dark);color:#fff;border-radius:999px;padding:12px 24px;font:600 12px Manrope;cursor:pointer}.search-btn:disabled{opacity:.72;cursor:wait}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 40px}.chip{border:1px solid var(--border);background:var(--paper);border-radius:999px;padding:7px 12px;font:500 10px Manrope;cursor:pointer}.chip:hover{border-color:var(--sage)}.results-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.results-head h2{font-size:30px;margin:0}.count{font-size:11px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:22px}.card-img{aspect-ratio:.72;background:var(--paper);border:1px solid var(--border);border-radius:9px;display:grid;place-items:center;overflow:hidden}.card-img img{width:100%;height:100%;object-fit:contain}.placeholder{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}.title{font-family:"DM Serif Display";font-size:18px;margin-top:10px}.meta{font-size:10px;color:var(--muted)}.result-desc{font-size:11px;color:var(--muted);line-height:1.45;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.empty{padding:70px 0;text-align:center;color:var(--muted);display:none}.error{padding:50px 0;color:#8a5647;text-align:center}.footer{margin-top:80px;border-top:1px solid var(--border);padding:28px 0;background:var(--sand)}.foot{display:flex;justify-content:space-between;gap:20px;font-size:11px;color:var(--muted)}
@media(max-width:900px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.container{width:calc(100% - 28px)}header{height:62px}.logo{font-size:25px}.nav-actions{gap:14px}.cards{grid-template-columns:1fr 1fr}.foot{flex-direction:column}.cat-menu-grid{grid-template-columns:1fr 1fr}}
@media(max-width:450px){.cat-menu-grid{grid-template-columns:1fr}}
</style>
<style>.cat-menu-loading{font-size:12px;color:var(--muted);padding:8px 0}</style></head>
<body>
<header><div class="container nav"><a class="logo" href="/">EliasArts</a><nav class="nav-actions"><a href="/search">Search</a><div class="cat-menu-wrap"><button class="cat-menu-btn" id="catMenuBtn" type="button" aria-expanded="false">Categories <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button><div class="cat-menu" id="catMenu"><div class="cat-menu-title">Browse categories</div><div id="catMenuGrid" class="cat-menu-grid"></div></div></div><a href="/info.html?page=about">About</a></nav></div></header>
<main class="container">
<section class="hero"><div class="crumb"><a href="/">Home</a> / Search</div><div class="eyebrow">Search printables</div><h1>Search printables.</h1><div class="intro">Find the perfect printable for your project, mood or occasion.</div>
<form class="search-box" id="searchForm"><input id="q" type="search" placeholder="Search printables..." autocomplete="off"><button class="search-btn" id="searchBtn">Search</button></form>
<div class="chips"><button class="chip" type="button" data-q="Coloring">Coloring</button><button class="chip" type="button" data-q="Cards">Cards</button><button class="chip" type="button" data-q="Wall Art">Wall Art</button><button class="chip" type="button" data-q="Planners">Planners</button><button class="chip" type="button" data-q="Calendars">Calendars</button></div></section>
<section><div class="results-head"><h2 id="heading">Latest printables</h2><span class="count" id="count"></span></div><div class="cards" id="results"></div><div class="empty" id="empty">No matching printables yet.</div><div class="error" id="error" hidden></div></section>
</main>
<footer class="footer"><div class="container foot"><span>EliasArts · Free printables for a more creative everyday.</span><span><a href="/">Home</a> · <a href="/info.html?page=contact">Contact</a> · <a href="/info.html?page=privacy">Privacy</a></span></div></footer>
<script>
const $=id=>document.getElementById(id),q=$('q'),results=$('results'),empty=$('empty'),error=$('error'),count=$('count'),heading=$('heading'),btn=$('searchBtn');
const esc=s=>String(s??'').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
function card(p){return '<a href="/printable.html?slug='+encodeURIComponent(p.slug)+'"><div class="card-img">'+(p.cover_url?'<img loading="lazy" src="'+p.cover_url+'" alt="'+esc(p.title)+'">':'<span class="placeholder">Preview</span>')+'</div><div class="title">'+esc(p.title)+'</div><div class="meta">'+esc(p.topic_name||p.category_name||'Printable')+' · Free</div>'+(p.description?'<div class="result-desc">'+esc(p.description)+'</div>':'')+'</a>'}
async function run(value){const term=value.trim();q.value=term;btn.disabled=true;btn.textContent='Searching…';results.innerHTML='';empty.style.display='none';error.hidden=true;try{const r=await fetch(term?'/api/search?q='+encodeURIComponent(term):'/api/printables');if(!r.ok)throw Error('The printable library is temporarily unavailable.');const data=await r.json();heading.textContent=term?'Search results for "'+term+'"':'Latest printables';count.textContent=data.length+' result'+(data.length===1?'':'s');results.innerHTML=data.map(card).join('');empty.style.display=data.length?'none':'block'}catch(e){count.textContent='';heading.textContent='Search';error.textContent=e.message;error.hidden=false}finally{btn.disabled=false;btn.textContent='Search'}}
$('searchForm').addEventListener('submit',e=>{e.preventDefault();run(q.value)});document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>run(b.dataset.q)));
q.value=new URLSearchParams(location.search).get('q')||'';run(q.value);


let catMenuLoaded=false;
async function loadCategoryMenu(){
 if(catMenuLoaded)return;
 catMenuLoaded=true;
 const grid=document.getElementById('catMenuGrid');
 if(grid)grid.innerHTML='<div class="cat-menu-loading">Loading categories…</div>';
 try{
  const r=await fetch('/api/navigation');
  if(!r.ok)throw Error();
  const cats=await r.json();
  if(grid)grid.innerHTML=cats.map(c=>'<div class="cat-menu-col"><a href="/category.html?slug='+encodeURIComponent(c.slug)+'">'+esc(c.name)+'</a>'+c.topics.map(t=>'<a class="topic-link" href="/category.html?slug='+encodeURIComponent(c.slug)+'&topic='+encodeURIComponent(t.slug)+'">'+esc(t.name)+'</a>').join('')+'</div>').join('');
 }catch(e){
  catMenuLoaded=false;
  if(grid)grid.innerHTML='<div class="cat-menu-loading">Categories could not be loaded. Please try again.</div>';
 }
}
const cmb=document.getElementById('catMenuBtn'),cm=document.getElementById('catMenu');
cmb?.addEventListener('click',e=>{
 e.stopPropagation();
 const open=cm.classList.toggle('open');
 cmb.setAttribute('aria-expanded',open?'true':'false');
 if(open)loadCategoryMenu();
});
document.addEventListener('click',()=>{cm?.classList.remove('open');cmb?.setAttribute('aria-expanded','false')});
</script>
</body>
</html>
